# Local development only. Production uses /opt/stacks/branchy and shared core-postgres.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: branchy
      POSTGRES_PASSWORD: branchy
      POSTGRES_DB: branchy
    ports:
      - "5432:5432"
    volumes:
      - branchy-postgres:/var/lib/postgresql/data
      # Local-dev only: seed a minimal shared `core` schema so the migrations boot.
      - ./deploy/core-init.sql:/docker-entrypoint-initdb.d/00-core-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branchy -d branchy"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://branchy:branchy@postgres:5432/branchy?sslmode=disable&options=-csearch_path%3Dbranchy
      HTTP_ADDR: :8080
      MIGRATIONS_DIR: /app/migrations
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  branchy-postgres:
